<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Arial, sans-serif">
  <rect width="780" height="300" fill="#ffffff"/>

  <!-- Panel a: decay equilibrium -->
  <g transform="translate(20,20)">
    <text x="110" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">(a) Equilibrio de declive</text>
    <line x1="10" y1="230" x2="220" y2="230" stroke="#333333" stroke-width="1.5" marker-end="url(#axe)"/>
    <line x1="10" y1="230" x2="10" y2="30" stroke="#333333" stroke-width="1.5" marker-end="url(#axe)"/>
    <path d="M 15 50 Q 60 60 90 100 Q 130 150 220 210" fill="none" stroke="#d62728" stroke-width="3"/>
    <text x="115" y="270" text-anchor="middle" font-size="11" fill="#555555">tiempo</text>
    <text x="-12" y="130" text-anchor="middle" font-size="11" fill="#555555" transform="rotate(-90 -12 130)">relieve</text>
    <text x="110" y="290" text-anchor="middle" font-size="10" fill="#666666">Declive monotónico sin fluctuaciones (ciclo davisiano)</text>
  </g>

  <!-- Panel b: dynamic equilibrium (steady state, fluctuating) -->
  <g transform="translate(280,20)">
    <text x="110" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">(b) Equilibrio dinámico</text>
    <line x1="10" y1="230" x2="220" y2="230" stroke="#333333" stroke-width="1.5" marker-end="url(#axe)"/>
    <line x1="10" y1="230" x2="10" y2="30" stroke="#333333" stroke-width="1.5" marker-end="url(#axe)"/>
    <line x1="15" y1="130" x2="220" y2="130" stroke="#999999" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 15 130 Q 35 100 55 130 Q 75 160 95 130 Q 115 105 135 130 Q 155 155 175 130 Q 195 108 220 130" fill="none" stroke="#2ca02c" stroke-width="3"/>
    <text x="115" y="270" text-anchor="middle" font-size="11" fill="#555555">tiempo</text>
    <text x="-12" y="130" text-anchor="middle" font-size="11" fill="#555555" transform="rotate(-90 -12 130)">relieve</text>
    <text x="110" y="290" text-anchor="middle" font-size="10" fill="#666666">Fluctuación en torno a un valor medio estable (steady-state)</text>
  </g>

  <!-- Panel c: dynamic metastable equilibrium (stepped) -->
  <g transform="translate(540,20)">
    <text x="110" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">(c) Equilibrio dinámico metaestable</text>
    <line x1="10" y1="230" x2="220" y2="230" stroke="#333333" stroke-width="1.5" marker-end="url(#axe)"/>
    <line x1="10" y1="230" x2="10" y2="30" stroke="#333333" stroke-width="1.5" marker-end="url(#axe)"/>
    <path d="M 15 100 Q 30 90 45 100 L 45 100 Q 55 170 90 175 Q 105 165 120 175 L 120 175 Q 130 90 165 95 Q 180 88 220 92" fill="none" stroke="#1f6feb" stroke-width="3"/>
    <line x1="52" y1="102" x2="52" y2="172" stroke="#d62728" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="55" y="95" font-size="9" fill="#d62728">umbral</text>
    <line x1="127" y1="90" x2="127" y2="173" stroke="#d62728" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="130" y="83" font-size="9" fill="#d62728">umbral</text>
    <text x="115" y="270" text-anchor="middle" font-size="11" fill="#555555">tiempo</text>
    <text x="-12" y="130" text-anchor="middle" font-size="11" fill="#555555" transform="rotate(-90 -12 130)">relieve</text>
    <text x="110" y="290" text-anchor="middle" font-size="10" fill="#666666">Cambios abruptos al superar umbrales, entre fases estables</text>
  </g>

  <defs>
    <marker id="axe" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
