<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Georgia, serif" font-size="18">
  <rect width="760" height="520" fill="#fff"/>
  <g transform="translate(90,40)">
    <!-- axes: 400 x 400 -->
    <rect x="0" y="0" width="400" height="400" fill="none" stroke="#333" stroke-width="1.5"/>
    <g stroke="#ddd">
      <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
      <line x1="0" y1="100" x2="400" y2="100"/><line x1="0" y1="200" x2="400" y2="200"/><line x1="0" y1="300" x2="400" y2="300"/>
    </g>
    <g font-size="15" fill="#333">
      <text x="0" y="422" text-anchor="middle">0</text><text x="200" y="422" text-anchor="middle">0.5</text><text x="400" y="422" text-anchor="middle">1</text>
      <text x="-10" y="405" text-anchor="end">0</text><text x="-10" y="205" text-anchor="end">0.5</text><text x="-10" y="5" text-anchor="end">1</text>
    </g>
    <text x="200" y="455" text-anchor="middle">Área relativa  a/A</text>
    <text x="-55" y="200" text-anchor="middle" transform="rotate(-90,-55,200)">Altura relativa  h/H</text>

    <!-- young: convex -->
    <path d="M0,0 C250,0 380,120 400,400" fill="none" stroke="#b23a2b" stroke-width="4"/>
    <!-- mature: S-shaped -->
    <path d="M0,0 C60,250 320,140 400,400" fill="none" stroke="#2e7d32" stroke-width="4"/>
    <!-- old: concave -->
    <path d="M0,0 C20,330 120,390 400,400" fill="none" stroke="#1f5f99" stroke-width="4"/>
  </g>
  <g transform="translate(520,90)" font-size="17">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#b23a2b" stroke-width="4"/>
    <text x="40" y="6">Juventud</text>
    <text x="40" y="28" font-size="14" fill="#555">desequilibrio, HI &gt; 0.6</text>
    <line x1="0" y1="70" x2="30" y2="70" stroke="#2e7d32" stroke-width="4"/>
    <text x="40" y="76">Madurez</text>
    <text x="40" y="98" font-size="14" fill="#555">equilibrio, HI ≈ 0.4–0.6</text>
    <line x1="0" y1="140" x2="30" y2="140" stroke="#1f5f99" stroke-width="4"/>
    <text x="40" y="146">Vejez</text>
    <text x="40" y="168" font-size="14" fill="#555">monadnock, HI &lt; 0.4</text>
    <text x="0" y="230" font-size="15" fill="#333">Esquema según Strahler (1952).</text>
    <text x="0" y="252" font-size="15" fill="#333">Rangos de HI orientativos.</text>
  </g>
</svg>
